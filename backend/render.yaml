services:
  - type: web
    name: ai-market-prediction-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: COINMARKETCAP_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: NEWS_DATA_API_KEY
        sync: false
      - key: MODELS_DIR
        value: /opt/render/project/src/../data/models
      - key: RENDER_API_KEY
        sync: false
    disk:
      name: models
      mountPath: /opt/render/project/data/models
      sizeGB: 1
